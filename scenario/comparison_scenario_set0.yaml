quad_config: config/quad.yaml

experiments:

  - name: hemisphere_target

    mode: compare

    simulation:
      dt: 0.01
      max_duration: 20.0

    initial_state:
      type: augmented_triple_integrator
      pos: [-25, 0, 15]
      vel: [0, 0, 10]
      acc: [0, 0, 9.81]

    target:
      type: sphere
      center: [0, 0, 10]
      radius: 3.0
      tol: 0.5

    planners:

      - model: augmented_triple_integrator
        planner: time_opt_traj_planner
        solver:
          type: root_finding
          config: config/solvers/root_finding.yaml
        color: blue

      - model: augmented_double_integrator
        planner: time_opt_traj_planner
        solver:
          type: root_finding
          config: config/solvers/root_finding.yaml
        color: red

  - name: fixed_endpoint

    mode: compare

    simulation:
      dt: 0.01
      max_duration: 20.0

    initial_state:
      type: augmented_triple_integrator
      pos: [-25, 0, 15]
      vel: [0, 0, 10]
      acc: [0, 0, 9.81]

    target:
      type: state
      pos: [0, 0, 10]
      vel: [0, 0, 0]
      acc: [0, 0, 9.81]

    planners:

      - model: augmented_triple_integrator
        planner: time_opt_traj_planner
        solver:
          type: direct_collocation
          config: config/solvers/direct_collocation.yaml
        color: blue

      - model: augmented_triple_integrator
        planner: time_opt_traj_planner
        solver:
          type: indirect_collocation
          config: config/solvers/direct_collocation.yaml
        color: magenta

      - model: augmented_double_integrator
        planner: time_opt_traj_planner
        solver:
          type: direct_collocation
          config: config/solvers/direct_collocation.yaml
        color: red